<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive CSS House & Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="nft-card" id="card">
	<!-- Starry sky -->
	<div class="stars" id="stars"></div>

	<!-- Sun / Moon -->
	<div class="celestial" id="celestial" title="Toggle Day / Night"></div>

	<!-- Cloud -->
	<div class="cloud cloud-1"></div>

	<!-- House with bird -->
	<div class="house">
	  <!-- Smoke -->
	  <div class="smoke-container" id="smoke">
		<div class="smoke"></div>
		<div class="smoke"></div>
		<div class="smoke"></div>
	  </div>
	  <!-- Chimney -->
	  <div class="chimney" id="chimney" title="Click: Toggle smoke"></div>

	  <!-- Bird -->
	  <div class="bird-wrapper" id="bird" title="Click the bird!">
		<div class="bird-fx" id="birdFx">♪</div>
		<div class="bird-tail"></div>
		<div class="bird-body">
		  <div class="bird-eye"></div>
		  <div class="bird-beak"></div>
		  <div class="bird-wing"></div>
		</div>
		<div class="bird-legs"></div>
	  </div>

	  <!-- Roof -->
	  <div class="roof"></div>

	  <!-- Walls, window, and door -->
	  <div class="walls">
		<div class="window" id="window" title="Click: Toggle light"></div>
		<div class="door-frame">
		  <div class="door" id="door" title="Click: Open/Close door"></div>
		</div>
	  </div>
	</div>

	<!-- Ground -->
	<div class="ground"></div>

	<!-- Tooltip badge -->
	<div class="hud-badge">Tap sun, bird, window, door & chimney ✨</div>
  </div>

  <script src="scrypt.js"></script>
</body>
</html>
