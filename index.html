<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cozy CSS House & Singing Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="nft-card" id="card">
    <div class="stars" id="stars"></div>
    <div class="celestial" id="celestial" title="Toggle Day / Night"></div>
    <div class="cloud cloud-1"></div>

    <div class="house">
      <div class="smoke-container" id="smoke">
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
      </div>
      <div class="chimney" id="chimney" title="Toggle smoke"></div>

      <div class="bird-wrapper" id="bird" title="Tap the bird!">
        <div class="bird-fx" id="birdFx">♪</div>
        <div class="bird-tail"></div>
        <div class="bird-body">
          <div class="bird-eye"></div>
          <div class="bird-beak"></div>
          <div class="bird-wing"></div>
        </div>
        <div class="bird-legs"></div>
      </div>

      <div class="roof"></div>

      <div class="walls">
        <div class="window" id="window" title="Toggle light"></div>
        <div class="door-frame">
          <div class="door" id="door" title="Open/Close door"></div>
        </div>
      </div>
    </div>

    <div class="ground"></div>
    <div class="hud-badge">Tap sun, bird, window, door & chimney ✨</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
